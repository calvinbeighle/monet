<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="vg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <!-- Left leg -->
  <line x1="5" y1="4" x2="16" y2="16" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Right leg -->
  <line x1="27" y1="4" x2="16" y2="16" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Left descent -->
  <line x1="16" y1="16" x2="5" y2="28" stroke="white" stroke-width="2.5" stroke-linecap="round" opacity="0.45"/>
  <!-- Right descent -->
  <line x1="16" y1="16" x2="27" y2="28" stroke="white" stroke-width="2.5" stroke-linecap="round" opacity="0.45"/>

  <!-- Top-left node -->
  <circle cx="5" cy="4" r="2.5" fill="url(#vg)"/>
  <!-- Top-right node -->
  <circle cx="27" cy="4" r="2.5" fill="url(#vg)"/>
  <!-- Center convergence node -->
  <circle cx="16" cy="16" r="3.5" fill="url(#vg)"/>
</svg>
