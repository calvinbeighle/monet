<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monet</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- =====================================================
       TOP BAR
       ===================================================== -->
  <header id="top-bar">
    <div id="top-bar-left">
      <span id="wordmark">Monet</span>
    </div>
    <div id="top-bar-right">
      <!-- Agent status pills injected here by JS -->
      <div id="agent-pills"></div>
      <!-- Connection status -->
      <div id="conn-status">
        <span id="conn-dot"></span>
        <span id="conn-label">Connecting</span>
      </div>
      <!-- New session button -->
      <button id="new-session-btn" title="New session">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        New
      </button>
    </div>
  </header>

  <!-- =====================================================
       MAIN CONTENT (pattern area)
       ===================================================== -->
  <main id="main-content">

    <!-- WELCOME SCREEN -->
    <div id="welcome-screen" class="pattern-view active">
      <div id="welcome-inner">
        <div id="welcome-logo">Monet</div>
        <div id="welcome-subtitle">Your agent-native OS</div>
        <div id="welcome-chips">
          <button class="chip" data-intent="Handle my inbox">
            <svg class="chip-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
            </svg>
            Handle my inbox
          </button>
          <button class="chip" data-intent="Review my PRs">
            <svg class="chip-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/>
            </svg>
            Review my PRs
          </button>
          <button class="chip" data-intent="Plan my sprint">
            <svg class="chip-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
            </svg>
            Plan my sprint
          </button>
          <button class="chip" data-intent="Brainstorm ideas">
            <svg class="chip-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"/><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"/><line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/><circle cx="12" cy="12" r="4"/>
            </svg>
            Brainstorm ideas
          </button>
        </div>
        <!-- Integrations connection status row -->
        <div id="welcome-connections">
          <span id="welcome-connections-label">Integrations:</span>
          <button id="connect-gmail-btn" class="connect-btn connect-btn--disconnected" title="Connect Gmail">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
            </svg>
            Gmail
          </button>
          <button id="connect-github-btn" class="connect-btn connect-btn--disconnected" title="Connect GitHub">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 00-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0020 4.77 5.07 5.07 0 0019.91 1S18.73.65 16 2.48a13.38 13.38 0 00-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 005 4.77a5.44 5.44 0 00-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 009 18.13V22"/>
            </svg>
            GitHub
          </button>
        </div>
      </div>
    </div>

    <!-- CHAT PATTERN -->
    <div id="chat-view" class="pattern-view">
      <button class="back-btn" onclick="resetToWelcome()">&larr; Back</button>
      <div id="chat-messages"></div>
    </div>

    <!-- TINDER PATTERN -->
    <div id="tinder-view" class="pattern-view">
      <div class="pattern-topbar">
        <button class="back-btn" onclick="resetToWelcome()">&larr; Back</button>
        <div id="tinder-counter"></div>
      </div>
      <div id="tinder-card">
        <div id="tinder-card-header">
          <span id="tinder-card-label"></span>
          <span id="tinder-card-subtitle"></span>
        </div>
        <div id="tinder-card-title"></div>
        <div id="tinder-card-body"></div>
        <div id="tinder-reply-section">
          <div class="reply-header">Suggested reply</div>
          <textarea id="tinder-reply-textarea" placeholder="Agent is drafting a reply..."></textarea>
        </div>
      </div>
      <!-- Commentary area: agent text shown below card while cards are active -->
      <div id="tinder-commentary"></div>
      <div id="tinder-actions">
        <button id="tinder-reject" class="tinder-btn reject">Skip</button>
        <button id="tinder-approve" class="tinder-btn approve">Send Reply</button>
      </div>
    </div>

    <!-- DIFF PATTERN -->
    <div id="diff-view" class="pattern-view">
      <button class="back-btn" onclick="resetToWelcome()">&larr; Back</button>
      <div id="diff-header">
        <div class="diff-panel-label">Original</div>
        <div class="diff-panel-label">Proposed</div>
      </div>
      <div id="diff-panels">
        <div class="diff-panel" id="diff-panel-original">
          <div id="diff-original" class="diff-panel-body"></div>
        </div>
        <div id="diff-divider"></div>
        <div class="diff-panel" id="diff-panel-proposed">
          <div id="diff-proposed" class="diff-panel-body"></div>
        </div>
      </div>
      <div id="diff-action-bar">
        <button class="diff-action-btn reject" id="diff-reject-all">Reject All</button>
        <button class="diff-action-btn approve" id="diff-approve-all">Approve All</button>
      </div>
    </div>

    <!-- WHITEBOARD PATTERN -->
    <div id="whiteboard-view" class="pattern-view">
      <button class="back-btn" onclick="resetToWelcome()">&larr; Back</button>
      <div id="whiteboard-canvas">
        <svg id="whiteboard-connections" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;"></svg>
        <div id="whiteboard-nodes"></div>
      </div>
    </div>

  </main>

  <!-- =====================================================
       COMMAND BAR (intent input)
       ===================================================== -->
  <footer id="intent-bar">
    <div id="intent-bar-inner">
      <div id="intent-input-wrap">
        <svg id="intent-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input
          id="intent-input"
          type="text"
          placeholder="What do you want to do?"
          autocomplete="off"
          spellcheck="false"
        />
      </div>
      <button id="intent-send" title="Send (Enter)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>
  </footer>

  <!-- =====================================================
       APPROVAL MODAL
       ===================================================== -->
  <div id="approval-overlay" class="hidden">
    <div id="approval-modal">
      <div id="approval-header">
        <div id="approval-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
            <line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
          </svg>
        </div>
        <div id="approval-title">Agent wants to take an action</div>
      </div>
      <div id="approval-tool-name"></div>
      <div id="approval-description"></div>
      <div id="approval-actions">
        <button id="approval-reject-btn" class="approval-btn reject">Reject</button>
        <button id="approval-approve-btn" class="approval-btn approve">Approve</button>
      </div>
    </div>
  </div>

  <!-- =====================================================
       AGENT MONITOR PANEL
       ===================================================== -->
  <div id="monitor-panel" class="hidden">
    <div id="monitor-header">
      <span id="monitor-title">Sessions</span>
      <button id="monitor-close">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
    <div id="monitor-list"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
