<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="vgrad" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="wgrad" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Node: top-left -->
  <circle cx="24" cy="20" r="5" fill="url(#vgrad)" opacity="0.9"/>
  <!-- Node: top-right -->
  <circle cx="104" cy="20" r="5" fill="url(#vgrad)" opacity="0.9"/>
  <!-- Node: bottom-left -->
  <circle cx="24" cy="108" r="5" fill="url(#vgrad)" opacity="0.5"/>
  <!-- Node: bottom-right -->
  <circle cx="104" cy="108" r="5" fill="url(#vgrad)" opacity="0.5"/>
  <!-- Node: convergence center -->
  <circle cx="64" cy="64" r="7" fill="url(#vgrad)" filter="url(#glow)"/>

  <!-- Left leg: top-left node down to center -->
  <line x1="24" y1="20" x2="64" y2="64" stroke="url(#wgrad)" stroke-width="3.5" stroke-linecap="round" opacity="0.95"/>
  <!-- Right leg: top-right node down to center -->
  <line x1="104" y1="20" x2="64" y2="64" stroke="url(#wgrad)" stroke-width="3.5" stroke-linecap="round" opacity="0.95"/>
  <!-- Left descent: center down to bottom-left -->
  <line x1="64" y1="64" x2="24" y2="108" stroke="url(#wgrad)" stroke-width="3.5" stroke-linecap="round" opacity="0.5"/>
  <!-- Right descent: center down to bottom-right -->
  <line x1="64" y1="64" x2="104" y2="108" stroke="url(#wgrad)" stroke-width="3.5" stroke-linecap="round" opacity="0.5"/>

  <!-- Violet accent cross-stroke at midpoints for the M valley -->
  <line x1="24" y1="20" x2="44" y2="48" stroke="url(#vgrad)" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <line x1="104" y1="20" x2="84" y2="48" stroke="url(#vgrad)" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
</svg>
