<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monet</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #09090b;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      overflow: hidden;
    }

    .splash-root {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      animation: fadeIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: scale(0.94) translateY(6px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .logo-wrap {
      width: 96px;
      height: 96px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .logo-wrap svg {
      width: 96px;
      height: 96px;
      filter: drop-shadow(0 0 18px rgba(139, 92, 246, 0.35));
    }

    .wordmark {
      font-size: 22px;
      font-weight: 300;
      letter-spacing: 0.18em;
      color: rgba(255, 255, 255, 0.82);
      text-transform: uppercase;
    }

    .dots {
      display: flex;
      gap: 7px;
      align-items: center;
      height: 12px;
    }

    .dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: rgba(139, 92, 246, 0.7);
      animation: pulse 1.4s ease-in-out infinite;
    }

    .dot:nth-child(1) { animation-delay: 0s; }
    .dot:nth-child(2) { animation-delay: 0.22s; }
    .dot:nth-child(3) { animation-delay: 0.44s; }

    @keyframes pulse {
      0%, 80%, 100% {
        opacity: 0.25;
        transform: scale(0.85);
      }
      40% {
        opacity: 1;
        transform: scale(1);
      }
    }
  </style>
</head>
<body>
  <div class="splash-root">
    <div class="logo-wrap">
      <!-- Inline logo SVG for zero-latency render -->
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
        <defs>
          <linearGradient id="vgrad" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#c4b5fd"/>
            <stop offset="100%" stop-color="#8b5cf6"/>
          </linearGradient>
          <linearGradient id="wgrad" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="100%" stop-color="#e2e8f0"/>
          </linearGradient>
          <filter id="glow">
            <feGaussianBlur stdDeviation="2.5" result="blur"/>
            <feMerge>
              <feMergeNode in="blur"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>
        </defs>
        <!-- Top-left node -->
        <circle cx="24" cy="20" r="5" fill="url(#vgrad)" opacity="0.9"/>
        <!-- Top-right node -->
        <circle cx="104" cy="20" r="5" fill="url(#vgrad)" opacity="0.9"/>
        <!-- Bottom-left node -->
        <circle cx="24" cy="108" r="5" fill="url(#vgrad)" opacity="0.5"/>
        <!-- Bottom-right node -->
        <circle cx="104" cy="108" r="5" fill="url(#vgrad)" opacity="0.5"/>
        <!-- Center convergence node -->
        <circle cx="64" cy="64" r="7" fill="url(#vgrad)" filter="url(#glow)"/>
        <!-- Left leg -->
        <line x1="24" y1="20" x2="64" y2="64" stroke="url(#wgrad)" stroke-width="3.5" stroke-linecap="round" opacity="0.95"/>
        <!-- Right leg -->
        <line x1="104" y1="20" x2="64" y2="64" stroke="url(#wgrad)" stroke-width="3.5" stroke-linecap="round" opacity="0.95"/>
        <!-- Left descent -->
        <line x1="64" y1="64" x2="24" y2="108" stroke="url(#wgrad)" stroke-width="3.5" stroke-linecap="round" opacity="0.5"/>
        <!-- Right descent -->
        <line x1="64" y1="64" x2="104" y2="108" stroke="url(#wgrad)" stroke-width="3.5" stroke-linecap="round" opacity="0.5"/>
        <!-- Violet accent cross-strokes -->
        <line x1="24" y1="20" x2="44" y2="48" stroke="url(#vgrad)" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
        <line x1="104" y1="20" x2="84" y2="48" stroke="url(#vgrad)" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
      </svg>
    </div>

    <div class="wordmark">Monet</div>

    <div class="dots">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
  </div>

  <script>
    // Redirect to the main shell after 3 seconds
    setTimeout(function() {
      window.location.replace('index.html');
    }, 3000);
  </script>
</body>
</html>
