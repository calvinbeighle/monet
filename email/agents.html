<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monet Terminal</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@6.0.0/css/xterm.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:-apple-system,sans-serif;height:100vh;display:flex;flex-direction:column}
.bar{height:36px;display:flex;align-items:center;padding:0 12px;gap:8px;background:#1a1a1a;border-bottom:1px solid #222;flex-shrink:0}
.bar-title{font-size:12px;color:rgba(255,255,255,0.4);flex:1;text-align:center}
.dot{width:10px;height:10px;border-radius:50%}
.dot.r{background:#ff5f57}
.dot.y{background:#febc2e}
.dot.g{background:#28c840}
.bar a{font-size:11px;color:rgba(255,255,255,0.25);text-decoration:none;transition:color 0.15s}
.bar a:hover{color:rgba(255,255,255,0.6)}
#terminal{flex:1;padding:4px}
.status{height:24px;display:flex;align-items:center;padding:0 12px;background:#1a1a1a;border-top:1px solid #222;flex-shrink:0}
.status-text{font-size:11px;color:rgba(255,255,255,0.3)}
</style>
</head>
<body>

<div class="bar">
  <div class="dot r"></div>
  <div class="dot y"></div>
  <div class="dot g"></div>
  <div class="bar-title">monet terminal</div>
  <a href="monet-mail.html">game</a>
</div>
<div id="terminal"></div>
<div class="status"><span class="status-text" id="status">connecting...</span></div>

<script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@6.0.0/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.11.0/lib/addon-fit.js"></script>
<script>
const term = new Terminal({
  cursorBlink: true,
  fontSize: 14,
  fontFamily: 'Menlo, Monaco, "Courier New", monospace',
  theme: {
    background: '#000000',
    foreground: '#cccccc',
    cursor: '#ffffff',
    selectionBackground: 'rgba(255,255,255,0.2)',
  },
  allowProposedApi: true,
});

const fitAddon = new FitAddon.FitAddon();
term.loadAddon(fitAddon);
term.open(document.getElementById('terminal'));
fitAddon.fit();

function connect() {
  const ws = new WebSocket('ws://localhost:8765');
  ws.binaryType = 'arraybuffer';

  ws.onopen = () => {
    document.getElementById('status').textContent = 'connected';
    // Send initial size
    ws.send(JSON.stringify({ type: 'resize', cols: term.cols, rows: term.rows }));
  };

  ws.onmessage = (event) => {
    if (event.data instanceof ArrayBuffer) {
      term.write(new Uint8Array(event.data));
    } else {
      term.write(event.data);
    }
  };

  ws.onclose = () => {
    document.getElementById('status').textContent = 'disconnected - reload to reconnect';
    term.writeln('\r\n\x1b[31m[connection closed]\x1b[0m');
  };

  ws.onerror = () => {
    document.getElementById('status').textContent = 'error - is terminal_server.py running?';
    term.writeln('\r\n\x1b[31m[cannot connect to ws://localhost:8765]\x1b[0m');
    term.writeln('\x1b[33mRun: python3 terminal_server.py\x1b[0m');
  };

  term.onData((data) => {
    if (ws.readyState === WebSocket.OPEN) ws.send(data);
  });

  window.addEventListener('resize', () => {
    fitAddon.fit();
    if (ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type: 'resize', cols: term.cols, rows: term.rows }));
    }
  });
}

connect();
</script>
</body>
</html>
